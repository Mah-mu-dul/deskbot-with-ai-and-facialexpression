; DeskBot firmware - ESP32-S3 CAM (N16R8 / N8R8 with octal PSRAM)
;
; Build & flash:   pio run -t upload
; Serial monitor:  pio device monitor
;
; espressif32 6.9.0 ships Arduino-ESP32 core 2.0.17 (ESP-IDF 4.4), which bundles
; esp32-camera and the I2S driver used here.

[env:deskbot]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; ---- Memory layout: octal PSRAM (OPI) + QIO flash ----
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
; Set to 8MB if your module is N8R8.
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  ; 0 = Serial on the CH340/UART USB port, 1 = Serial on the native USB port
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  moononournation/GFX Library for Arduino@1.4.9
  bblanchon/ArduinoJson@^7.2.0
